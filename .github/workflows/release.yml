name: Build and Release
on:
  push:
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - windows
          - macos
          - linux
      version_type:
        description: 'Version Type'
        required: true
        default: 'custom'
        type: choice
        options:
          - alpha
          - beta
          - stable
          - custom
      base_version:
        description: 'Base version for alpha, beta, or stable (e.g. 4.1.0; blank = automatic)'
        required: false
        default: ''
      custom_version:
        description: 'Custom Version (only if Type is custom)'
        required: false
        default: ''
permissions:
  contents: write
jobs:
  build-and-release:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    outputs:
      version: ${{ steps.version.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.platform == 'windows' && '["windows-latest"]' || inputs.platform == 'macos' && '["macos-latest"]' || inputs.platform == 'linux' && '["ubuntu-latest"]' || '["windows-latest","ubuntu-latest","macos-latest"]') }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CI: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Verify Xcode toolchain
        if: matrix.os == 'macos-latest'
        run: |
          xcodebuild -version
          xcrun actool --version
      - name: Set package version from release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: node scripts/bump-version.js tag "${{ github.ref_name }}"
      - name: Calculate and set version
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
        shell: bash
        env:
          VERSION_TYPE: ${{ github.event.inputs.version_type }}
          BASE_VERSION: ${{ github.event.inputs.base_version }}
          CUSTOM_VERSION: ${{ github.event.inputs.custom_version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" == "pull_request" ]; then
            node scripts/bump-version.js alpha
          elif [ "$VERSION_TYPE" == "custom" ]; then
            node scripts/bump-version.js custom "$CUSTOM_VERSION"
          else
            node scripts/bump-version.js "$VERSION_TYPE" "$BASE_VERSION"
          fi
      - name: Read final version
        id: version
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Sign MSBTEditorCLI hosts (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          codesign --force --sign - tools/MSBTEditorCLI/osx-arm64/MSBTEditorCli tools/MSBTEditorCLI/osx-x64/MSBTEditorCli
          codesign --verify tools/MSBTEditorCLI/osx-arm64/MSBTEditorCli tools/MSBTEditorCLI/osx-x64/MSBTEditorCli

      - name: Build and publish (Windows)
        if: matrix.os == 'windows-latest'
        env:
          CSC_LINK: fightplanner.pfx
          CSC_KEY_PASSWORD: "F0w2Ke7?$rW#"
        run: npm run dist -- --publish ${{ github.event_name == 'pull_request' && 'never' || 'always' }}
      - name: Build and publish (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: npm run dist -- --publish ${{ github.event_name == 'pull_request' && 'never' || 'always' }}
      - name: Upload dist artifacts (fallback)
        if: github.event_name == 'pull_request' && always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/*.blockmap
            dist/*.yml
            dist/*.yaml
          if-no-files-found: ignore
          retention-days: 3
  release-downloads:
    name: Add download links to the release
    needs: build-and-release
    if: always() && github.event_name != 'pull_request' && needs.build-and-release.outputs.version != ''
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Write the download grid
        run: node scripts/release-downloads.js "v${{ needs.build-and-release.outputs.version }}"
